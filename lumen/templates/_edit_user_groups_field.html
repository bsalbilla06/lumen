{# Group picker for the Edit User dialog: current groups as removable pills plus a typeahead input. Driven by group-pills.js. #}
<div class="mb-3">
  <label class="form-label" for="edit-user-groups">Groups</label>
  <div id="edit-user-groups-box" class="form-control group-pills-box position-relative">
    <ul id="edit-user-groups-pills" class="group-pills list-unstyled m-0 p-0" aria-label="Current groups"></ul>
    <input type="text" id="edit-user-groups" class="group-pills-input" placeholder="Add a group…"
           role="combobox" aria-autocomplete="list" aria-expanded="false"
           aria-controls="edit-user-groups-list" aria-describedby="edit-user-groups-help" autocomplete="off">
    <ul id="edit-user-groups-list" role="listbox" aria-label="Matching groups" class="dropdown-menu w-100 mb-0 p-0"></ul>
  </div>
  <div id="edit-user-groups-help" class="form-text">Type to add a group. Auto-join groups and groups the user owns can't be removed here.</div>
  <div id="edit-user-groups-live" class="visually-hidden" aria-live="polite"></div>
</div>
<style>
.group-pills-box { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem; cursor: text; min-height: calc(1.5em + .75rem + 2px); height: auto; }
.group-pills-box:focus-within { border-color: #86b7fe; box-shadow: 0 0 0 .25rem rgba(13,110,253,.25); }
.group-pills { display: flex; flex-wrap: wrap; gap: .25rem; }
.group-pills li { display: inline-flex; align-items: center; gap: .25rem; }
.group-pills .btn-remove-group { border: 0; background: none; color: inherit; padding: 0 .1rem; line-height: 1; }
.group-pills .btn-remove-group:hover, .group-pills .btn-remove-group:focus-visible { outline: 2px solid currentColor; border-radius: 2px; }
.group-pills-input { flex: 1 1 8rem; min-width: 8rem; border: 0; outline: 0; padding: 0; background: transparent; }
#edit-user-groups-list { top: 100%; left: 0; max-height: 14rem; overflow: auto; }
#edit-user-groups-list .active { background-color: #13294b; color: #fff; }
</style>
